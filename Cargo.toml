[package]
name = "sabertooth"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
authors = ["RAW Lab <github.com/raw-lab>"]
description = "Sabertooth — a pure-Rust reimplementation of the MMseqs2 profile/PSSM sensitivity core"
license = "MIT"

[[bin]]
name = "sabertooth"
path = "src/main.rs"

[lib]
name = "sabertooth"
path = "src/lib.rs"

[dependencies]
rayon = "=1.10.0"
# Streaming gzip FASTA input (pure-Rust miniz_oxide backend, no C toolchain).
flate2 = { version = "=1.0.35", default-features = false, features = ["rust_backend"] }
# Memory-mapped persistent seed index (bounded RSS: pages are file-backed).
memmap2 = "=0.9.5"
# Optional distributed backend (RAW-lab HydraMPP), vendored. Off by default so the
# ordinary build stays dependency-light; enable with `--features distributed`.
hydra-mpp-core = { path = "vendor/hydra-mpp-core", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# Already a HydraMPP dependency; used to round-trip the wire types in tests.
bincode = { version = "=1.3.3", optional = true }

[dev-dependencies]
flate2 = { version = "=1.0.35", default-features = false, features = ["rust_backend"] }

[features]
default = []
# Distribute search across HydraMPP workers/nodes (also pulls in serde for the
# task wire types). GPU-aware scheduling (`--gpus`) rides on this feature too.
distributed = ["dep:hydra-mpp-core", "dep:serde", "dep:bincode"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
