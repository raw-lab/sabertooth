[package]
name = "hydra-mpp-core"
description = "HydraMPP core engine (vendored for Sabertooth's optional distributed backend)"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "CC-BY-NC-4.0"
authors = [
    "Jose L. Figueroa III <jlfiguer@charlotte.edu>",
    "Richard Allen White III <rwhit101@uncc.edu>",
]
repository = "https://github.com/raw-lab/HydraMPP"

[lib]
name = "hydra_mpp_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
anyhow = "1"
gethostname = "0.4"
lz4_flex = { version = "0.10", default-features = false, features = ["safe-encode", "safe-decode"], optional = true }

[features]
compression = ["dep:lz4_flex"]
