[package]
edition = "2021"
rust-version = "1.75"
name = "sabertooth"
version = "0.2.0"
authors = [
    "Richard Allen White III <rwhit101@uncc.edu>",
    "RAW Lab <github.com/raw-lab>",
]
build = false
exclude = [
    "compare/",
    "STEPS.md",
    "*.tar.gz",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure-Rust reimplementation of the MMseqs2 profile/PSSM sensitivity core (search, clustering, taxonomy, translated & profile-profile search)."
homepage = "https://github.com/raw-lab/sabertooth"
readme = "README.md"
keywords = [
    "bioinformatics",
    "mmseqs2",
    "alignment",
    "proteins",
    "homology",
]
categories = [
    "science",
    "command-line-utilities",
]
license = "MIT"
repository = "https://github.com/raw-lab/sabertooth"

[features]
default = []
distributed = [
    "dep:hydra-mpp-core",
    "dep:serde",
]

[lib]
name = "sabertooth"
path = "src/lib.rs"

[[bin]]
name = "sabertooth"
